spring:
  application:
    name: student_details

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${jdbc:mysql://localhost:3306/login}
    username: ${root}
    password: ${java}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true

  main:
    allow-circular-references: true

server:
  port: ${PORT:8080}