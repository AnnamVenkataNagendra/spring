spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/login}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:sowmya}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

    show-sql: true
  main:
    allow-circular-references: true

server:
  port: ${PORT:8080}
  